  <style>
    /* CSS RESET & VARIABLES */
    :root {
      --bg-main: #0a0a0c;
      --bg-card: #121318;
      --bg-card-hover: #181920;
      --bg-glass: rgba(18, 19, 24, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(203, 243, 12, 0.3);
      
      --accent-lime: #cbf30c;
      --accent-lime-muted: rgba(203, 243, 12, 0.15);
      --accent-lime-glow: rgba(203, 243, 12, 0.4);
      
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dark: #0a0a0c;
      
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-heading: 'Space Grotesk', sans-serif;
      
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
      
      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-slow: 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      
      --container-max: 1280px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    body {
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Custom Cursor */
    .custom-cursor {
      width: 10px;
      height: 10px;
      background: var(--accent-lime);
      border-radius: 50%;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, width 0.2s ease, height 0.2s ease, background-color 0.2s ease;
    }

    .custom-cursor-follower {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(203, 243, 12, 0.4);
      border-radius: 50%;
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.25s cubic-bezier(0.1, 1, 0.1, 1);
    }

    body.hovering a, body.hovering button {
      cursor: pointer;
    }
    body.hovering .custom-cursor {
      width: 16px;
      height: 16px;
      background: var(--accent-lime);
      box-shadow: 0 0 15px var(--accent-lime);
    }
    body.hovering .custom-cursor-follower {
      width: 50px;
      height: 50px;
      border-color: var(--accent-lime);
      background: rgba(203, 243, 12, 0.05);
    }

    @media (hover: none) or (pointer: coarse) {
      .custom-cursor, .custom-cursor-follower { display: none; }
    }

    /* ACCESSIBILITY & REDUCED MOTION */
    :focus-visible {
      outline: 2px solid var(--accent-lime);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .custom-cursor, .custom-cursor-follower { display: none; }
    }

    /* BACKGROUND GLOW EFFECTS */
    .bg-glow-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .glow-spot {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
    }

    .glow-spot-1 {
      top: -10%;
      right: -5%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-lime) 0%, transparent 70%);
    }

    .glow-spot-2 {
      bottom: 10%;
      left: -10%;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
      opacity: 0.08;
    }

    /* LAYOUT & CONTAINERS */
    .container {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 1.5rem;
      position: relative;
      z-index: 1;
    }

    section {
      padding: 5rem 0;
    }

    /* TYPOGRAPHY */
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-heading);
      color: var(--text-main);
      font-weight: 700;
      line-height: 1.15;
    }

    .heading-xl {
      font-size: clamp(2.75rem, 6vw, 5.25rem);
      letter-spacing: -0.03em;
    }

    .heading-lg {
      font-size: clamp(2rem, 4vw, 3.25rem);
      letter-spacing: -0.02em;
    }

    .heading-md {
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      letter-spacing: -0.01em;
    }

    .text-lime { color: var(--accent-lime); }
    .text-muted { color: var(--text-muted); }
    .text-mono { font-family: monospace; font-size: 0.9em; letter-spacing: 0.05em; }

    /* NAVIGATION */
    .navbar {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: calc(100% - 3rem);
      max-width: var(--container-max);
    }

    .nav-inner {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: var(--transition-smooth);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .brand-logo {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-lime);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-lime);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: var(--transition-fast);
      position: relative;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent-lime);
      border-radius: 2px;

    .btn-contact {
      background: var(--accent-lime);

      padding: 0.5rem 1.25rem;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: none;
      cursor: pointer;
    }

    .btn-contact:hover {
      transform: translateY(-2px);

    }
